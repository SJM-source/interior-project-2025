{% extends 'base.html' %}

{% block style %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='mypage.css') }}">
{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 1400px; margin-top: 150px; margin-bottom: 3rem;">
    <div class="row justify-content-center">
        <!-- 중앙 컬럼: 회원정보 -->
        <div class="col-md-8">
            <!-- 헤더 섹션 -->
            <header class="mb-4">
                <div class="d-flex align-items-center">
                    <!-- 프로필 사진 영역 (업로드 기능 없음) -->
                    <div class="position-relative me-4">
                        <div class="rounded-circle overflow-hidden" style="width: 80px; height: 80px; background-color: #f5f5f5;">
                            <img src="{{ g.user.profile_image if g.user.profile_image else 'https://prs.ohousecdn.com/apne2/user/images/user-profile/v1-438811778732160.png' }}"
                                 alt="프로필 이미지"
                                 class="w-100 h-100 object-fit-cover">
                        </div>
                    </div>

                    <div>
                        <h2 class="fw-bold mb-1">{{ g.user.username }}</h2>
                    </div>

                    <!-- 회원정보 수정 버튼 (로그아웃 왼쪽에 비치함) -->
                    <a href="{{ url_for('auth.edit_profile') }}"
                       class="btn btn-outline-dark btn-sm ms-auto me-2">
                        회원정보 수정
                    </a>

                    <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary btn-sm">로그아웃</a>
                </div>

                <!-- 배송지/전화번호 정보 -->
                <div class="border rounded mt-4 position-relative">
                    <div class="row g-0">
                        <div class="col-md-6 p-4 border-end">
                            <h6 class="text-muted mb-3">이메일</h6>
                            <p class="mb-0">{{ g.user.email if g.user.email else '등록된 이메일이 없습니다' }}</p>
                        </div>
                        <div class="col-md-6 p-4">
                            <h6 class="text-muted mb-3">전화번호</h6>
                            <p class="mb-0">{{ g.user.phone if g.user.phone else '등록된 전화번호가 없습니다' }}</p>
                        </div>
                    </div>
                </div>
            </header>
        </div>
    </div>
</div>
{% endblock %}
